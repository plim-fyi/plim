[workspace]
resolver = "3"
members = ["server", "crates/plim-core", "crates/plim-cli", "crates/plim-wasm"]

# Crypto (PBKDF2 unlock, proof-of-work) is painfully slow unoptimized; keep
# dependencies fast in debug builds.
[profile.dev.package."*"]
opt-level = 2

# The web app's WebAssembly (tools/wasm/build.sh): small and fast.
[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
