[package]
name = "plim-cli"
version = "0.20.0"  # the release this is (CHANGELOG.md has what's in each)
edition = "2024"
description = "Terminal client for Plim end-to-end encrypted notes"
license = "MIT OR Apache-2.0"

# Plim's command (#568), `plim`.
[[bin]]
name = "plim"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
directories = "6.0.0"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
hex = "0.4.3"
httpdate = "1.0.3"
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust", "linux-native", "apple-native"] }
ratatui = "0.30"
ratatui-textarea = "0.9.2"
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "2.7.0"
plim-core = { version = "0.1.0", path = "../plim-core" }
tokio = { version = "1.53.1", features = ["full"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["v4"] }
yrs = "0.28.0"

[dev-dependencies]
plim-server = { path = "../../server" }
